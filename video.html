<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ignition Lab | Video</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Unbounded:wght@600;700;800&display=swap");

      :root {
        --deloitte-green: #86bc25;
        --dark-bg: #070707;
        --text-color: #ffffff;
        --card-bg: rgba(16, 16, 16, 0.85);
        --muted: #a6a6a6;
        --accent-glow: rgba(134, 188, 37, 0.35);
        --glass: rgba(18, 18, 18, 0.65);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background:
          radial-gradient(
            1200px 500px at 15% -10%,
            rgba(134, 188, 37, 0.22),
            transparent 60%
          ),
          radial-gradient(
            900px 600px at 90% 10%,
            rgba(255, 255, 255, 0.08),
            transparent 65%
          ),
          linear-gradient(160deg, #050505 0%, #0a0a0a 60%, #0d0f0b 100%);
        color: var(--text-color);
        font-family:
          "Space Grotesk", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }

      .global-header {
        text-align: center;
        margin-top: 3vh;
        height: 15vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 8px;
        z-index: 10;
      }

      .title-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      .event-title {
        font-family: "Unbounded", "Space Grotesk", sans-serif;
        font-size: 3.4rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin: 0;
        background: linear-gradient(90deg, #fff, var(--deloitte-green));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 40px var(--accent-glow);
      }

      .event-subtitle {
        font-size: 1.05rem;
        font-weight: 400;
        margin: 0;
        color: var(--muted);
        letter-spacing: 1px;
        display: inline-flex;
        gap: 12px;
        align-items: center;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--deloitte-green);
        box-shadow: 0 0 12px var(--accent-glow);
      }

      .video-frame {
        position: relative;
        width: min(92vw, calc(70vh * var(--video-aspect, 1.7778)));
        aspect-ratio: var(--video-aspect, 1.7778);
        margin-top: 2vh;
        border-radius: 24px;
        padding: 12px;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(134, 188, 37, 0.35);
        box-shadow:
          0 0 60px rgba(0, 0, 0, 0.5),
          0 0 30px var(--accent-glow);
      }

      .video-frame::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 26px;
        background: radial-gradient(
          1200px 400px at 20% -20%,
          rgba(134, 188, 37, 0.35),
          transparent 60%
        );
        z-index: 0;
        opacity: 0.6;
      }

      .video-container {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 18px;
        overflow: hidden;
        background: rgba(5, 5, 5, 0.9);
        z-index: 1;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .video-controls {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(134, 188, 37, 0.45);
        background: rgba(10, 10, 10, 0.6);
        backdrop-filter: blur(6px);
        color: #e6f3c6;
        font-size: 0.75rem;
        letter-spacing: 0.4px;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .video-controls:hover {
        background: rgba(134, 188, 37, 0.2);
      }

      .sound-toggle {
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        cursor: pointer;
        padding: 0 2px;
      }

      .volume-control {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        max-width: 0;
        opacity: 0;
        transition:
          max-width 0.25s ease,
          opacity 0.25s ease;
      }

      .video-controls.expanded .volume-control {
        max-width: 140px;
        opacity: 1;
      }

      .volume-control input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 90px;
        height: 3px;
        background: rgba(134, 188, 37, 0.3);
        border-radius: 999px;
        outline: none;
      }

      .volume-control input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--deloitte-green);
        box-shadow: 0 0 10px var(--accent-glow);
        cursor: pointer;
      }

      .volume-control input[type="range"]::-moz-range-thumb {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--deloitte-green);
        border: none;
        box-shadow: 0 0 10px var(--accent-glow);
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .event-title {
          font-size: 2.4rem;
        }

        .video-frame {
          width: min(92vw, calc(62vh * var(--video-aspect, 1.7778)));
        }
      }
    </style>
  </head>
  <body>
    <header class="global-header">
      <div class="title-container">
        <h1 class="event-title">Ignition Lab</h1>
      </div>
      <p class="event-subtitle">
        <span class="dot"></span>
        Ignition Lab Showcase
      </p>
    </header>

    <section class="video-frame">
      <div class="video-container">
        <video autoplay loop muted playsinline></video>
        <div class="video-controls">
          <button class="sound-toggle" type="button" aria-pressed="false">
            Sound off
          </button>
          <label class="volume-control" aria-label="Volume">
            <input type="range" min="0" max="1" step="0.05" value="0.5" />
          </label>
        </div>
      </div>
    </section>

    <script>
      const video = document.querySelector("video");
      const frame = document.querySelector(".video-frame");
      const controls = document.querySelector(".video-controls");
      const soundToggle = document.querySelector(".sound-toggle");
      const volumeSlider = document.querySelector(".volume-control input");
      const defaultVideo = "ep1.mp4";
      const allowedVideos = new Set([
        "video1.mp4",
        "ep1.mp4",
        "ep2.mp4",
        "ep3.mp4",
        "ep4.mp4",
        "ep5.mp4",
        "ep6.mp4",
        "ep7.mp4",
        "ep8.mp4",
      ]);
      const videoParam = new URLSearchParams(window.location.search).get("v");
      const selectedVideo =
        videoParam && allowedVideos.has(videoParam) ? videoParam : defaultVideo;

      video.src = `videos/${selectedVideo}`;
      video.volume = Number(volumeSlider.value);
      let collapseTimer = null;

      video.addEventListener("loadedmetadata", () => {
        if (video.videoWidth && video.videoHeight) {
          const ratio = video.videoWidth / video.videoHeight;
          frame.style.setProperty("--video-aspect", ratio.toString());
        }
      });

      soundToggle.addEventListener("click", () => {
        video.muted = !video.muted;
        soundToggle.textContent = video.muted ? "Sound off" : "Sound on";
        soundToggle.setAttribute("aria-pressed", String(!video.muted));
        if (video.muted) {
          controls.classList.remove("expanded");
        }
      });

      volumeSlider.addEventListener("input", () => {
        const volume = Number(volumeSlider.value);
        video.volume = volume;
        if (volume > 0 && video.muted) {
          video.muted = false;
          soundToggle.textContent = "Sound on";
          soundToggle.setAttribute("aria-pressed", "true");
        }
        if (volume === 0) {
          video.muted = true;
          soundToggle.textContent = "Sound off";
          soundToggle.setAttribute("aria-pressed", "false");
          controls.classList.remove("expanded");
        }
      });

      const scheduleCollapse = () => {
        if (collapseTimer) {
          clearTimeout(collapseTimer);
        }
        collapseTimer = setTimeout(() => {
          controls.classList.remove("expanded");
        }, 1500);
      };

      controls.addEventListener("mouseenter", () => {
        if (collapseTimer) {
          clearTimeout(collapseTimer);
        }
        if (!video.muted) {
          controls.classList.add("expanded");
        }
      });

      controls.addEventListener("mouseleave", () => {
        scheduleCollapse();
      });
    </script>
  </body>
</html>
